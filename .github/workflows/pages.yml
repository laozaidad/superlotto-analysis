name: Deploy analysis website

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      refresh_history:
        description: '检查500网新增历史；取消勾选可仅部署已保留的数据'
        type: boolean
        default: true
  schedule:
    # UTC 14:30 / 23:30 = 北京时间、Asia/Singapore 22:30 / 次日07:30。
    - cron: '30 14,23 * * *'

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  validate-and-package:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pages: read
    outputs:
      site_commit: ${{ steps.release.outputs.site_commit }}
    steps:
      - uses: actions/checkout@v4
        with:
          # 等待并发锁后取最新main，避免排队的旧事件覆盖新发布。
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install validation dependencies
        run: |
          python -m pip install -r requirements-dev.txt
          npm ci
      - name: Check and stage public history additions
        id: refresh
        if: github.event_name != 'workflow_dispatch' || inputs.refresh_history
        shell: bash
        run: |
          python3 scripts/update_history.py --site-dir site | tee "$RUNNER_TEMP/history-refresh.json"
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          result = json.loads((Path(os.environ['RUNNER_TEMP']) / 'history-refresh.json').read_text())
          with open(os.environ['GITHUB_OUTPUT'], 'a') as handle:
              handle.write(f"status={result['status']}\n")
          PY
      - name: Record history refresh outcome
        if: always()
        shell: bash
        run: |
          {
            echo '### Public history check'
            if [ -s "$RUNNER_TEMP/history-refresh.json" ]; then
              echo '```json'
              cat "$RUNNER_TEMP/history-refresh.json"
              echo '```'
            else
              echo 'No successful refresh report: check was skipped or failed. No data commit was made.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Validate Python model and exporter
        run: |
          ruff check .
          mypy
          python -m unittest discover -s tests -v
      - name: Validate website
        run: |
          npm run check
          npm test
          test -f site/index.html
          test -f site/data/snapshot.json
      - name: Verify browser runtime model and data
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          runtime = Path('site/runtime')
          manifest = json.loads((runtime / 'manifest.json').read_text(encoding='utf-8'))
          model = (runtime / 'model.py').read_bytes()
          history = (runtime / 'history.csv').read_bytes()
          canonical = Path('skills/superlotto/scripts/model.py').read_bytes()
          assert manifest['schema_version'] == 1, 'Unsupported runtime manifest'
          assert model == canonical, 'Browser model differs from canonical Python model'
          assert hashlib.sha256(model).hexdigest() == manifest['model_sha256'], 'Model hash mismatch'
          for name, key in [('research.py', 'research_sha256'), ('conditional_core.py', 'conditional_core_sha256')]:
              content = (runtime / name).read_bytes()
              assert content == (Path('skills/superlotto/scripts') / name).read_bytes(), f'{name} differs from canonical source'
              assert hashlib.sha256(content).hexdigest() == manifest[key], f'{name} hash mismatch'
          assert manifest['history']['history_start_issue'] == '23001'
          assert manifest['history']['first_id'] >= '23001'
          assert hashlib.sha256(history).hexdigest() == manifest['data_sha256'], 'History hash mismatch'
          print('Browser runtime matches canonical model and manifest hashes')
          PY
      - name: Commit only validated public data
        shell: bash
        run: |
          # 并发锁不阻止人工push：若main已经前进则停止，绝不force/rebase旧产物。
          remote_head=$(git ls-remote origin refs/heads/main | cut -f1)
          test "$remote_head" = "$(git rev-parse HEAD)" || { echo 'main changed during validation; rerun this workflow.' >&2; exit 1; }
          git add -- site/data/snapshot.json site/runtime/history.csv site/runtime/manifest.json \
            site/runtime/model.py site/runtime/research.py site/runtime/conditional_core.py
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m '自动更新2023年以来的公共历史数据'
            git push origin HEAD:main
          fi
      - name: Record actual artifact revision
        id: release
        shell: bash
        run: |
          # 无新增也发布已验证产物，修复上一轮数据已提交但部署失败的情况。
          site_commit=$(git rev-parse HEAD)
          echo "site_commit=$site_commit" >> "$GITHUB_OUTPUT"
          {
            echo '### Actual website artifact'
            echo "Source commit: $site_commit"
            sha256sum site/runtime/manifest.json site/runtime/history.csv
            echo 'Pages event metadata may refer to the triggering commit; the source commit above includes any data update.'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload only public website files
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    needs: validate-and-package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Reject obsolete artifacts before deployment
        env:
          EXPECTED_COMMIT: ${{ needs.validate-and-package.outputs.site_commit }}
          REPOSITORY_URL: https://github.com/${{ github.repository }}.git
        shell: bash
        run: |
          remote_head=$(git ls-remote "$REPOSITORY_URL" refs/heads/main | cut -f1)
          test "$remote_head" = "$EXPECTED_COMMIT" || { echo 'main advanced; refusing to deploy an obsolete artifact.' >&2; exit 1; }
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
